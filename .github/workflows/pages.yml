name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sanitize frontend document
        shell: python
        run: python .github/scripts/sanitize-pages.py

      - name: Inject runtime compatibility and non-blocking data boot
        shell: python
        run: |
          from pathlib import Path
          path = Path('./frontend/index.html')
          text = path.read_text(encoding='utf-8')

          compat = '<script src="./runtime-compat.js"></script>'
          cesium = '<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'
          if compat not in text:
              if cesium not in text:
                  raise SystemExit('Could not find Cesium script in frontend/index.html')
              text = text.replace(cesium, cesium + f'\n  {compat}', 1)

          guard = '<script src="./boot-guard.js"></script>'
          if guard not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in frontend/index.html')
              text = text.replace(marker, f'  {guard}\n{marker}', 1)

          path.write_text(text, encoding='utf-8')
          print('Runtime compatibility and post-dashboard boot guard injected')

      - name: Validate Pages artifact
        shell: python
        run: |
          from pathlib import Path
          index = Path('./frontend/index.html').read_text(encoding='utf-8')
          guard = Path('./frontend/boot-guard.js')
          compat = Path('./frontend/runtime-compat.js')
          cesium = '<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'
          assert guard.exists(), 'boot-guard.js missing'
          assert compat.exists(), 'runtime-compat.js missing'
          assert '</html>' in index, 'missing closing HTML tag'
          assert index.rstrip().endswith('</html>'), 'HTML has trailing content after </html>'
          assert 'Initial data load failed' not in index, 'legacy raw boot text leaked into HTML'
          assert '<script src="./runtime-compat.js"></script>' in index, 'runtime compatibility not injected'
          assert '<script src="./boot-guard.js"></script>' in index, 'boot guard not injected'
          assert index.index(cesium) < index.index('<script src="./runtime-compat.js"></script>'), 'runtime compatibility must load after Cesium'
          assert index.index('<script src="./boot-guard.js"></script>') > index.index('</body>') - 200, 'boot guard must be at the end of the document'
          print('Pages artifact validation passed; Cesium preserved; no raw boot text')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
