name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sanitize frontend document
        shell: python
        run: python .github/scripts/sanitize-pages.py

      - name: Repair frontend boot path
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')

          # Repair the known Cesium failure path without changing Cesium itself.
          # Match the block by its semantic boundaries rather than indentation.
          atmosphere = re.compile(
              r"//\s*Dark atmosphere.*?viewer\.scene\.moon\.show\s*=\s*false\s*;",
              re.S,
          )
          replacement = """// Dark atmosphere — only when the Cesium Viewer exists.
          if (viewer && !viewer.isDestroyed()) {
            viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
            viewer.scene.skyAtmosphere.hueShift = -0.97;
            viewer.scene.skyAtmosphere.saturationShift = -0.95;
            viewer.scene.skyAtmosphere.brightnessShift = -0.7;
            viewer.scene.skyBox.show = false;
            viewer.scene.sun.show = false;
            viewer.scene.moon.show = false;
          }"""
          text, n = atmosphere.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not locate Cesium atmosphere block')

          # Remove the old location gate. It can silently choose New Delhi when
          # permission is denied and can block startup while the browser waits.
          location_block = re.compile(
              r"//\s*─── AUTO-DETECT LOCATION.*?(?=//\s*─── AUTO-REFRESH every 5 minutes)",
              re.S,
          )
          replacement = """// ─── AUTO-DETECT LOCATION ────────────────────────────────────────────────────
          // Device location is handled by atmos-runtime.js. The dashboard boots
          // immediately and location is an optional enhancement.

          """
          text, n = location_block.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not locate old auto-location block')

          # Keep the existing Cesium library and existing compatibility layer.
          cesium = '<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'
          compat = '<script src="./runtime-compat.js"></script>'
          if compat not in text:
              if cesium not in text:
                  raise SystemExit('Cesium 1.122 script is missing')
              text = text.replace(cesium, cesium + '\n' + compat, 1)

          runtime = '<script src="./atmos-runtime.js"></script>'
          if runtime not in text:
              text = text.replace('</body>', '  ' + runtime + '\n</body>', 1)

          guard = '<script src="./boot-guard.js"></script>'
          if guard not in text:
              text = text.replace('</body>', '  ' + guard + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          print('Frontend boot repair complete')

      - name: Validate Pages artifact
        shell: python
        run: |
          from pathlib import Path
          index = Path('frontend/index.html').read_text(encoding='utf-8')
          assert index.rstrip().endswith('</html>'), 'HTML has trailing content after </html>'
          assert 'Initial data load failed' not in index, 'legacy boot text leaked into HTML'
          assert 'Cesium' in index, 'Cesium content missing'
          assert 'https://cesium.com/downloads/cesiumjs/releases/1.122/' in index, 'Cesium 1.122 missing'
          assert 'if (viewer && !viewer.isDestroyed()) {' in index, 'Cesium failure guard missing'
          assert '<script src="./atmos-runtime.js"></script>' in index, 'location runtime missing'
          assert '<script src="./runtime-compat.js"></script>' in index, 'compatibility layer missing'
          assert '<script src="./boot-guard.js"></script>' in index, 'boot guard missing'
          assert Path('frontend/atmos-runtime.js').exists(), 'atmos-runtime.js missing'
          assert Path('frontend/runtime-compat.js').exists(), 'runtime-compat.js missing'
          assert Path('frontend/boot-guard.js').exists(), 'boot-guard.js missing'
          print('Pages artifact validation passed')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
