name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject runtime compatibility and non-blocking data boot
        shell: python
        run: |
          from pathlib import Path
          path = Path('./frontend/index.html')
          text = path.read_text(encoding='utf-8')

          compat = '<script src="./runtime-compat.js"></script>'
          if compat not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Could not find </head> in frontend/index.html')
              text = text.replace(marker, f'  {compat}\n{marker}', 1)

          # The boot guard must run after the inline dashboard script has defined
          # fetchAll. Injecting it into <head> made the old guard a no-op.
          guard = '<script src="./boot-guard.js"></script>'
          if guard not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in frontend/index.html')
              text = text.replace(marker, f'  {guard}\n{marker}', 1)

          path.write_text(text, encoding='utf-8')
          print('Runtime compatibility and post-dashboard boot guard injected')

      - name: Validate Pages artifact
        shell: python
        run: |
          from pathlib import Path
          index = Path('./frontend/index.html').read_text(encoding='utf-8')
          guard = Path('./frontend/boot-guard.js')
          compat = Path('./frontend/runtime-compat.js')
          assert guard.exists(), 'boot-guard.js missing'
          assert compat.exists(), 'runtime-compat.js missing'
          assert '<script src="./runtime-compat.js"></script>' in index, 'runtime compatibility not injected'
          assert '<script src="./boot-guard.js"></script>' in index, 'boot guard not injected'
          assert index.index('<script src="./runtime-compat.js"></script>') < index.index('<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'), 'compatibility layer must load before Cesium'
          assert index.index('<script src="./boot-guard.js"></script>') > index.index('</script>', index.index('<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>')), 'boot guard must be after the dashboard script'
          assert 'https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js' in index, 'Cesium script missing'
          print('Pages artifact validation passed; Cesium preserved')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
