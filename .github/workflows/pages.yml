name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build deterministic Pages artifact
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')

          end = text.lower().rfind('</html>')
          if end < 0:
              raise SystemExit('frontend/index.html has no </html>')
          text = text[:end + len('</html>')] + '\n'

          atmosphere_start = text.find('// Dark atmosphere')
          atmosphere_end = text.find('// Fly to initial location', atmosphere_start)
          if atmosphere_start < 0 or atmosphere_end < 0:
              raise SystemExit('Cesium atmosphere section markers not found')
          atmosphere = '''// Dark atmosphere — only when the Cesium Viewer exists.
          if (viewer && typeof viewer.isDestroyed === 'function' && !viewer.isDestroyed()) {
            viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
            viewer.scene.skyAtmosphere.hueShift = -0.97;
            viewer.scene.skyAtmosphere.saturationShift = -0.95;
            viewer.scene.brightnessShift = -0.7;
            viewer.scene.skyBox.show = false;
            viewer.scene.sun.show = false;
            viewer.scene.moon.show = false;
          }

          '''
          text = text[:atmosphere_start] + atmosphere + text[atmosphere_end:]

          location_start = text.find('// ─── AUTO-DETECT LOCATION')
          location_end = text.find('// ─── AUTO-REFRESH every 5 minutes', location_start)
          if location_start < 0 or location_end < 0:
              raise SystemExit('Auto-location section markers not found')
          location_replacement = '''// ─── AUTO-DETECT LOCATION ────────────────────────────────────────────────────
          // Device location is handled by atmos-runtime.js. The dashboard does
          // not block on permission or silently substitute New Delhi.

          '''
          text = text[:location_start] + location_replacement + text[location_end:]

          cesium = '<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'
          compat = '<script src="./runtime-compat.js"></script>'
          recovery = '<script src="./globe-recovery.js"></script>'
          if cesium not in text:
              raise SystemExit('Cesium 1.122 script missing')
          if compat not in text:
              text = text.replace(cesium, cesium + '\n' + compat, 1)
          if recovery not in text:
              text = text.replace(compat, compat + '\n' + recovery, 1)

          runtime = '<script src="./atmos-runtime.js"></script>'
          guard = '<script src="./boot-guard.js"></script>'
          if runtime not in text or guard not in text:
              body = text.find('</body>')
              if body < 0:
                  raise SystemExit('Missing </body>')
              additions = ''
              if runtime not in text:
                  additions += '  ' + runtime + '\n'
              if guard not in text:
                  additions += '  ' + guard + '\n'
              text = text[:body] + additions + text[body:]

          # The fallback script must execute after the dashboard's inline script
          # so it can detect whether Cesium actually produced a viewer canvas.
          fallback = '<script src="./globe-recovery.js"></script>'
          # It is already loaded before the inline script for constructor recovery;
          # do not duplicate it at the end.

          path.write_text(text, encoding='utf-8')
          print('Deterministic Pages artifact built')

      - name: Validate Pages artifact
        shell: python
        run: |
          from pathlib import Path
          index = Path('frontend/index.html').read_text(encoding='utf-8')
          assert index.rstrip().endswith('</html>'), 'HTML has trailing content after </html>'
          assert 'Initial data load failed' not in index, 'legacy boot text leaked into HTML'
          assert 'https://cesium.com/downloads/cesiumjs/releases/1.122/' in index, 'Cesium 1.122 missing'
          assert 'if (viewer && typeof viewer.isDestroyed === \'function\'' in index, 'Cesium failure guard missing'
          assert '<script src="./runtime-compat.js"></script>' in index, 'runtime compatibility layer missing'
          assert '<script src="./globe-recovery.js"></script>' in index, 'globe recovery layer missing'
          assert '<script src="./atmos-runtime.js"></script>' in index, 'location runtime missing'
          assert '<script src="./boot-guard.js"></script>' in index, 'boot guard missing'
          assert Path('frontend/runtime-compat.js').exists()
          assert Path('frontend/globe-recovery.js').exists()
          assert Path('frontend/atmos-runtime.js').exists()
          assert Path('frontend/boot-guard.js').exists()
          print('Pages artifact validation passed')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
