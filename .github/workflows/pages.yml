name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sanitize frontend document
        shell: python
        run: python .github/scripts/sanitize-pages.py

      - name: Repair Cesium failure path and location boot
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('./frontend/index.html')
          text = path.read_text(encoding='utf-8')

          # The source catches a Cesium Viewer construction failure, but older
          # code then dereferences viewer.scene outside that catch. Keep Cesium
          # untouched; simply make the post-init styling conditional.
          old = '''// Dark atmosphere
          viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
          viewer.scene.skyAtmosphere.hueShift    = -0.97;
          viewer.scene.skyAtmosphere.saturationShift = -0.95;
          viewer.scene.skyAtmosphere.brightnessShift = -0.7;
          viewer.scene.skyBox.show = false;
          viewer.scene.sun.show = false;
          viewer.scene.moon.show = false;'''
          new = '''// Dark atmosphere — only when the Cesium Viewer actually exists.
          if (viewer && !viewer.isDestroyed()) {
            viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
            viewer.scene.skyAtmosphere.hueShift = -0.97;
            viewer.scene.skyAtmosphere.saturationShift = -0.95;
            viewer.scene.skyAtmosphere.brightnessShift = -0.7;
            viewer.scene.skyBox.show = false;
            viewer.scene.sun.show = false;
            viewer.scene.moon.show = false;
          }'''
          if old not in text:
              raise SystemExit('Expected Cesium post-init block not found')
          text = text.replace(old, new, 1)

          # The old auto-detect block silently falls back to New Delhi when
          # permission is denied. The runtime layer below owns location retry,
          # so remove that duplicate path rather than showing stale coordinates.
          pattern = re.compile(r'// ─── AUTO-DETECT LOCATION.*?// ─── AUTO-REFRESH every 5 minutes', re.S)
          replacement = '''// ─── AUTO-DETECT LOCATION ────────────────────────────────────────────────────
          // Handled by frontend/atmos-runtime.js so permission failures are
          // visible and the user can retry without silently selecting Delhi.

          // ─── AUTO-REFRESH every 5 minutes'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected auto-location block not found')

          # Runtime is deliberately loaded after the inline dashboard script:
          # it patches apiGet before the boot guard and requests device location.
          runtime = '<script src="./atmos-runtime.js"></script>'
          if runtime not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body>')
              text = text.replace(marker, f'  {runtime}\n{marker}', 1)

          path.write_text(text, encoding='utf-8')
          print('Cesium failure guard and location runtime injected')

      - name: Inject legacy compatibility and final boot guard
        shell: python
        run: |
          from pathlib import Path
          path = Path('./frontend/index.html')
          text = path.read_text(encoding='utf-8')

          compat = '<script src="./runtime-compat.js"></script>'
          cesium = '<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>'
          if compat not in text:
              if cesium not in text:
                  raise SystemExit('Could not find Cesium script in frontend/index.html')
              text = text.replace(cesium, cesium + f'\n  {compat}', 1)

          guard = '<script src="./boot-guard.js"></script>'
          if guard not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in frontend/index.html')
              text = text.replace(marker, f'  {guard}\n{marker}', 1)

          path.write_text(text, encoding='utf-8')
          print('Compatibility and boot guard injected')

      - name: Validate Pages artifact
        shell: python
        run: |
          from pathlib import Path
          index = Path('./frontend/index.html').read_text(encoding='utf-8')
          for required in ['atmos-runtime.js','runtime-compat.js','boot-guard.js']:
              assert Path('./frontend/' + required).exists(), required + ' missing'
          assert '</html>' in index, 'missing closing HTML tag'
          assert index.rstrip().endswith('</html>'), 'HTML has trailing content after </html>'
          assert 'Initial data load failed' not in index, 'legacy raw boot text leaked into HTML'
          assert '<script src="./atmos-runtime.js"></script>' in index, 'location runtime not injected'
          assert '<script src="./runtime-compat.js"></script>' in index, 'compatibility layer not injected'
          assert '<script src="./boot-guard.js"></script>' in index, 'boot guard not injected'
          assert 'if (viewer && !viewer.isDestroyed()) {' in index, 'Cesium post-init guard missing'
          assert 'GLOBE UNAVAILABLE — DATA FEED ACTIVE' in index, 'Cesium failure state missing'
          assert 'Cesium' in index, 'Cesium content missing'
          print('Pages artifact validation passed: Cesium preserved, no raw boot text, location runtime present')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
