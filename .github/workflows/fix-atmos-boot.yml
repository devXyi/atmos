name: Fix Atmos globe and location boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair frontend runtime safely
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/index.html")
          text = path.read_text(encoding="utf-8")

          # Remove the stale script accidentally appended after </html>.
          if "</html>" in text:
              text = text[:text.rfind("</html>") + len("</html>")] + "\n"

          globe_start = text.index("// ─── CESIUM GLOBE ────────────────────────────────────────────────────────────")
          globe_end = text.index("// ─── LAYER TOGGLE STATE ──────────────────────────────────────────────────────", globe_start)

          globe = r'''// ─── CESIUM GLOBE ────────────────────────────────────────────────────────────
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS0zMGU5ODkzMzgwNDMiLCJpZCI6MjU5LCJpYXQiOjE2NjcyNDkzNjJ9.KgCe55bqPhFCx1-OtrMmJy28TDqBbVfD_YaT4bVlpVs';

let viewer = null;
let cesiumInitError = null;

function initCesiumViewer() {
  const common = {
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayer: false,
    animation: false,
    baseLayerPicker: false,
    fullscreenButton: false,
    geocoder: false,
    homeButton: false,
    infoBox: false,
    sceneModePicker: false,
    selectionIndicator: false,
    timeline: false,
    navigationHelpButton: false,
    scene3DOnly: true,
    useBrowserRecommendedResolution: true,
  };

  // Mobile-safe first attempt. Cesium normally rejects software rendering;
  // Atmos allows it as a last-resort path so a low-end Android device can
  // still get a globe instead of a hard initialization failure.
  const attempts = [
    {
      ...common,
      contextOptions: {
        webgl: {
          alpha: false,
          depth: true,
          stencil: false,
          antialias: false,
          preserveDrawingBuffer: false,
          failIfMajorPerformanceCaveat: false,
          powerPreference: 'default',
        },
      },
    },
    {
      ...common,
      contextOptions: {
        requestWebgl1: true,
        webgl: {
          alpha: false,
          depth: true,
          stencil: false,
          antialias: false,
          preserveDrawingBuffer: false,
          failIfMajorPerformanceCaveat: false,
          powerPreference: 'default',
        },
      },
    },
  ];

  let lastError = null;
  for (const options of attempts) {
    try {
      viewer = new Cesium.Viewer('cesium-container', options);
      return true;
    } catch (error) {
      lastError = error;
      try {
        if (viewer && viewer.isDestroyed && !viewer.isDestroyed()) viewer.destroy();
      } catch (_) {}
      viewer = null;
    }
  }

  cesiumInitError = lastError;
  return false;
}

const cesiumReady = initCesiumViewer();

if (cesiumReady && viewer) {
  // Optional imagery/terrain upgrades never participate in boot success.
  if (Cesium.createWorldTerrainAsync) {
    Cesium.createWorldTerrainAsync({ requestVertexNormals: true })
      .then(t => { if (viewer && !viewer.isDestroyed()) viewer.terrainProvider = t; })
      .catch(e => console.warn('Terrain unavailable:', e));
  }

  if (Cesium.IonImageryProvider && Cesium.ImageryLayer?.fromProviderAsync) {
    Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(3954))
      .then(layer => { if (viewer && !viewer.isDestroyed()) viewer.imageryLayers.add(layer); })
      .catch(e => console.warn('Sentinel imagery unavailable:', e));
  }

  try {
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
    viewer.scene.skyAtmosphere.hueShift = -0.97;
    viewer.scene.skyAtmosphere.saturationShift = -0.95;
    viewer.scene.skyAtmosphere.brightnessShift = -0.7;
    viewer.scene.skyBox.show = false;
    viewer.scene.sun.show = false;
    viewer.scene.moon.show = false;
  } catch (error) {
    console.warn('Atmosphere styling unavailable:', error);
  }
} else {
  const detail = cesiumInitError?.message ? ` — ${cesiumInitError.message}` : '';
  console.error('Cesium initialization failed after mobile-safe retries:', cesiumInitError);
  document.getElementById('cesium-container').innerHTML =
    `<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:rgba(232,236,244,.4);font:11px Space Mono,monospace;letter-spacing:.08em">GLOBE UNAVAILABLE — WEBGL INITIALIZATION FAILED${detail}</div>`;
}

// Fly to initial location
flyTo(state.lat, state.lon, 2000000);

function flyTo(lat, lon, height = 2000000) {
  if (!viewer || viewer.isDestroyed()) return;
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, height),
    duration: 1.8,
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-55), roll: 0 },
  });
}

// Click on globe → fetch data for clicked point
if (viewer) viewer.screenSpaceEventHandler.setInputAction(async (click) => {
  const pos = viewer.scene.pickPosition(click.position);
  if (!pos) return;
  const carto = Cesium.Cartographic.fromCartesian(pos);
  const lat = Cesium.Math.toDegrees(carto.latitude);
  const lon = Cesium.Math.toDegrees(carto.longitude);
  await setLocation(lat, lon);
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

'''
          text = text[:globe_start] + globe + text[globe_end:]

          # Location changes must fetch data immediately; reverse geocoding is
          # only a display enhancement and has a bounded timeout.
          loc_start = text.index("async function setLocation(lat, lon) {")
          loc_end = text.index("\n}\n\n// ─── FETCH ALL DATA", loc_start) + 2
          location = r'''async function setLocation(lat, lon) {
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  state.lat = lat;
  state.lon = lon;
  document.getElementById('hdr-coords').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  flyTo(lat, lon, 800000);
  document.getElementById('search-input').value = '';

  // Critical path: data first.
  const dataPromise = fetchAll().catch(error => {
    console.error('Location data refresh failed:', error);
  });

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    try {
      const r = await fetch(`${GEOCODE_URL}/reverse?lat=${lat}&lon=${lon}&format=json`, {
        signal: controller.signal,
        headers: { 'Accept': 'application/json' },
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      const city = d.address?.city || d.address?.town || d.address?.village || d.address?.municipality || d.address?.county || '';
      const country = d.address?.country_code?.toUpperCase() || '';
      state.cityName = [city, country].filter(Boolean).join(', ') || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
    } finally {
      clearTimeout(timeoutId);
    }
  } catch {
    state.cityName = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  }

  document.getElementById('hdr-city').textContent = state.cityName;
  await dataPromise;
}'''
          text = text[:loc_start] + location + text[loc_end:]

          # Render immediately, then ask for device location with an explicit
          # timeout. A location failure never falls back silently to blocking.
          auto_start = text.index("// ─── AUTO-DETECT LOCATION ────────────────────────────────────────────────────")
          auto_end = text.index("// ─── AUTO-REFRESH every 5 minutes ────────────────────────────────────────────", auto_start)
          boot = r'''// ─── BOOT: DATA FIRST, LOCATION SECOND ───────────────────────────────────────
fetchAll().catch(error => console.error('Initial data load failed:', error));

// ─── AUTO-DETECT LOCATION ────────────────────────────────────────────────────
function requestUserLocation() {
  if (!navigator.geolocation) {
    toast('Device location is unavailable; keeping default location.', 'info');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const accuracy = Number(pos.coords.accuracy);
      console.info('Atmos device location acquired:', pos.coords.latitude, pos.coords.longitude, '±', accuracy, 'm');
      setLocation(pos.coords.latitude, pos.coords.longitude).catch(error => {
        console.warn('Location refresh failed; keeping current dashboard data:', error);
      });
    },
    error => {
      console.warn('Atmos geolocation unavailable:', error?.code, error?.message);
      if (error?.code === 1) {
        toast('Location permission denied. Allow location access to use your device location.', 'info');
      } else if (error?.code === 3) {
        toast('Location request timed out. You can use Search or coordinates.', 'info');
      }
    },
    {
      enableHighAccuracy: false,
      timeout: 10000,
      maximumAge: 60000,
    }
  );
}

requestUserLocation();

'''
          text = text[:auto_start] + boot + text[auto_end:]

          assert text.rstrip().endswith('</html>'), 'frontend/index.html has trailing content after </html>'
          checks = [
              "fetchAll().catch(error => console.error('Initial data load failed:', error));",
              'timeout: 10000,',
              'failIfMajorPerformanceCaveat: false',
              'requestWebgl1: true',
              'if (cesiumReady && viewer)',
              'const dataPromise = fetchAll()',
          ]
          for check in checks:
              assert check in text, f'missing: {check}'

          path.write_text(text, encoding='utf-8')
          print('Atmos runtime repair applied and validated')

      - name: Commit repaired frontend and deploy Pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-atmos-boot.yml
          git add frontend/index.html .github/workflows/fix-atmos-boot.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: restore Cesium globe and device location boot'
          git push origin main
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
