name: Apply Atmos frontend fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/fix-atmos-loading' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-atmos-loading
          fetch-depth: 0

      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text()

          old = """const queryApiBase = normalizeApiBase(queryApiRaw);\nlet storedApiBase = null;\ntry {\n  if (queryApiBase) window.localStorage.setItem('ATMOS_API', queryApiBase);\n  storedApiBase = normalizeApiBase(window.localStorage.getItem('ATMOS_API'));\n} catch (_) { /* storage may be unavailable */ }\n\nconst DEFAULT_API_BASE = window.location.protocol === 'file:'\n  ? 'http://localhost:8080/api/v1'\n  : `${window.location.origin}/api/v1`;\nconst API_BASE = normalizeApiBase(queryApiBase || storedApiBase || window.ATMOS_API) || DEFAULT_API_BASE;\nconst API_TIMEOUT_MS = 12000; // 12s hard timeout for unreachable static deployments\nconst GEOCODE_URL = 'https://nominatim.openstreetmap.org';\nconst IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');\nconst STATIC_DEMO_MODE = IS_GITHUB_PAGES && !(queryApiBase || storedApiBase || window.ATMOS_API);\nlet shownStaticDemoToast = false;"""
          new = """const queryApiBase = normalizeApiBase(queryApiRaw);\nconst GEOCODE_URL = 'https://nominatim.openstreetmap.org';\nconst IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');\nlet storedApiBase = null;\ntry {\n  if (queryApiBase) window.localStorage.setItem('ATMOS_API', queryApiBase);\n  if (!IS_GITHUB_PAGES) storedApiBase = normalizeApiBase(window.localStorage.getItem('ATMOS_API'));\n} catch (_) {}\nconst DEFAULT_API_BASE = window.location.protocol === 'file:'\n  ? 'http://localhost:8080/api/v1'\n  : `${window.location.origin}/api/v1`;\nconst explicitApiBase = queryApiBase || window.ATMOS_API || (!IS_GITHUB_PAGES ? storedApiBase : null);\nconst API_BASE = normalizeApiBase(explicitApiBase) || DEFAULT_API_BASE;\nconst API_TIMEOUT_MS = 12000;\nconst STATIC_DEMO_MODE = IS_GITHUB_PAGES && !explicitApiBase;\nlet shownStaticDemoToast = false;"""
          assert old in s, 'API config block not found'
          s = s.replace(old, new, 1)

          start = s.index('async function apiGet(path) {')
          end = s.index('\n}\n\n// ─── STATE', start) + 2
          new_api = """async function apiGet(path) {\n  if (STATIC_DEMO_MODE) {\n    const demo = demoResponse(path);\n    if (demo) {\n      if (!shownStaticDemoToast) {\n        shownStaticDemoToast = true;\n        toast('Running in static demo mode. Add ?api=<your_backend>/api/v1 to use live backend.', 'info');\n      }\n      return demo;\n    }\n  }\n  const controller = new AbortController();\n  const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);\n  try {\n    const resp = await fetch(API_BASE + path, { signal: controller.signal });\n    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n    return resp.json();\n  } finally {\n    clearTimeout(timeoutId);\n  }\n}"""
          s = s[:start] + new_api + s[end:]

          # Cesium 1.122 requires the async ion imagery factory. Use OSM as the\n          # synchronous boot layer; live Sentinel imagery is optional and can be\n          # added later without blocking the data dashboard.
          old_img = "imageryProvider: new Cesium.IonImageryProvider({ assetId: 3954 }), // Sentinel-2"
          new_img = "imageryProvider: new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' }), // boot-safe base layer"
          assert old_img in s, 'Cesium imagery line not found'
          s = s.replace(old_img, new_img, 1)

          # Make the globe optional: data rendering must continue if WebGL/Cesium fails.
          s = s.replace("const viewer = new Cesium.Viewer('cesium-container', {", "let viewer = null;\ntry {\n  viewer = new Cesium.Viewer('cesium-container', {", 1)
          marker = "});\n\n// Dark atmosphere"
          assert marker in s, 'Cesium viewer end marker not found'
          s = s.replace(marker, "});\n} catch (error) {\n  console.error('Cesium unavailable; continuing with data dashboard:', error);\n  document.getElementById('cesium-container').innerHTML = '<div style=\"height:100%;display:flex;align-items:center;justify-content:center;color:rgba(232,236,244,.35);font:11px Space Mono,monospace;letter-spacing:.08em\">GLOBE UNAVAILABLE — DATA FEED ACTIVE</div>';\n}\n\n// Dark atmosphere", 1)

          # Guard only the calls that touch the viewer after a failed initialization.
          s = s.replace("function flyTo(lat, lon, height = 2000000) {\n  viewer.camera.flyTo({", "function flyTo(lat, lon, height = 2000000) {\n  if (!viewer || viewer.isDestroyed()) return;\n  viewer.camera.flyTo({", 1)
          s = s.replace("async function renderAQIHeatmap() {\n  // Remove old", "async function renderAQIHeatmap() {\n  if (!viewer || viewer.isDestroyed()) return;\n  // Remove old", 1)
          s = s.replace("function renderFireLayer() {\n  state.fireEntities", "function renderFireLayer() {\n  if (!viewer || viewer.isDestroyed()) return;\n  state.fireEntities", 1)
          s = s.replace("function renderCityMarkers() {\n  state.cityEntities", "function renderCityMarkers() {\n  if (!viewer || viewer.isDestroyed()) return;\n  state.cityEntities", 1)

          p.write_text(s)
          PY

      - name: Validate and clean temporary workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('frontend/index.html').read_text()
          for x in ['const explicitApiBase =', 'const STATIC_DEMO_MODE = IS_GITHUB_PAGES && !explicitApiBase;', 'function apiGet(path)', 'OpenStreetMapImageryProvider', 'let viewer = null;']:
              assert x in s, x
          print('Atmos fix checks passed')
          PY
          git checkout origin/main -- README.md
          rm -f .github/workflows/patch-atmos-loading.yml .github/workflows/apply-atmos-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html README.md .github/workflows/patch-atmos-loading.yml .github/workflows/apply-atmos-fix-pr.yml
          git commit -m 'fix: prevent Atmos frontend from hanging [atmos-fix-applied]'
          git push origin agent/fix-atmos-loading
