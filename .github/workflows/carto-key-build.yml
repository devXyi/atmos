name: Inject CARTO key

on:
  workflow_dispatch:

jobs:
  verify-carto-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate CARTO key is configured
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: |
          if [ -z "$CARTO_KEY" ]; then
            echo "CARTO_KEY secret is not configured."
            exit 1
          fi
          echo "CARTO_KEY is configured."

      - name: Export CARTO key for build steps
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: |
          echo "CARTO_KEY=$CARTO_KEY" >> "$GITHUB_ENV"
          echo "CARTO_KEY_AVAILABLE=true" >> "$GITHUB_ENV"
