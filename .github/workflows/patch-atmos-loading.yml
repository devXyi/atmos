name: Apply Atmos loading fix

on:
  push:
    branches:
      - agent/fix-atmos-loading

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[atmos-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend boot and static API mode
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')

          old_config = """const queryApiBase = normalizeApiBase(queryApiRaw);\nlet storedApiBase = null;\ntry {\n  if (queryApiBase) window.localStorage.setItem('ATMOS_API', queryApiBase);\n  storedApiBase = normalizeApiBase(window.localStorage.getItem('ATMOS_API'));\n} catch (_) { /* storage may be unavailable */ }\n\nconst DEFAULT_API_BASE = window.location.protocol === 'file:'\n  ? 'http://localhost:8080/api/v1'\n  : `${window.location.origin}/api/v1`;\nconst API_BASE = normalizeApiBase(queryApiBase || storedApiBase || window.ATMOS_API) || DEFAULT_API_BASE;\nconst API_TIMEOUT_MS = 12000; // 12s hard timeout for unreachable static deployments\nconst GEOCODE_URL = 'https://nominatim.openstreetmap.org';\nconst IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');\nconst STATIC_DEMO_MODE = IS_GITHUB_PAGES && !(queryApiBase || storedApiBase || window.ATMOS_API);\nlet shownStaticDemoToast = false;"""
          new_config = """const queryApiBase = normalizeApiBase(queryApiRaw);\nconst GEOCODE_URL = 'https://nominatim.openstreetmap.org';\nconst IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');\n\n// GitHub Pages is a static deployment. Only an explicit ?api=... or\n// window.ATMOS_API should opt it into a live backend. Do not let a stale\n// localStorage value disable the built-in demo fallback.\nlet storedApiBase = null;\ntry {\n  if (queryApiBase) window.localStorage.setItem('ATMOS_API', queryApiBase);\n  if (!IS_GITHUB_PAGES) {\n    storedApiBase = normalizeApiBase(window.localStorage.getItem('ATMOS_API'));\n  }\n} catch (_) { /* storage may be unavailable */ }\n\nconst DEFAULT_API_BASE = window.location.protocol === 'file:'\n  ? 'http://localhost:8080/api/v1'\n  : `${window.location.origin}/api/v1`;\nconst explicitApiBase = queryApiBase || window.ATMOS_API || (!IS_GITHUB_PAGES ? storedApiBase : null);\nconst API_BASE = normalizeApiBase(explicitApiBase) || DEFAULT_API_BASE;\nconst API_TIMEOUT_MS = 12000;\nconst STATIC_DEMO_MODE = IS_GITHUB_PAGES && !explicitApiBase;\nlet shownStaticDemoToast = false;"""
          if old_config not in text:
              raise SystemExit('config block not found')
          text = text.replace(old_config, new_config, 1)

          old_api = """async function apiGet(path) {\n  const controller = new AbortController();\n  const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);\n  try {\n    const resp = await fetch(API_BASE + path, { signal: controller.signal });\n    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n    return resp.json();\n  } catch (e) {\n    if (STATIC_DEMO_MODE) {\n      const demo = demoResponse(path);\n      if (demo) {\n        if (!shownStaticDemoToast) {\n          shownStaticDemoToast = true;\n          toast('Running in static demo mode. Add ?api=<your_backend>/api/v1 to use live backend.', 'info');\n        }\n        return demo;\n      }\n    }\n    throw e;\n  } finally {\n    clearTimeout(timeoutId);\n  }\n}"""
          new_api = """async function apiGet(path) {\n  // Static Pages mode must not wait for a backend that cannot exist on\n  // github.io. Return deterministic demo data immediately.\n  if (STATIC_DEMO_MODE) {\n    const demo = demoResponse(path);\n    if (demo) {\n      if (!shownStaticDemoToast) {\n        shownStaticDemoToast = true;\n        toast('Running in static demo mode. Add ?api=<your_backend>/api/v1 to use live backend.', 'info');\n      }\n      return demo;\n    }\n  }\n\n  const controller = new AbortController();\n  const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);\n  try {\n    const resp = await fetch(API_BASE + path, { signal: controller.signal });\n    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n    return resp.json();\n  } catch (e) {\n    if (STATIC_DEMO_MODE) {\n      const demo = demoResponse(path);\n      if (demo) return demo;\n    }\n    throw e;\n  } finally {\n    clearTimeout(timeoutId);\n  }\n}"""
          if old_api not in text:
              raise SystemExit('apiGet block not found')
          text = text.replace(old_api, new_api, 1)

          start = text.index("Cesium.Ion.defaultAccessToken =")
          end = text.index("// ─── LAYER TOGGLE STATE ──────────────────────────────────────────────────────", start)
          cesium = r'''Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS0zMGU5ODkzMzgwNDMiLCJpZCI6MjU5LCJpYXQiOjE2NjcyNDkzNjJ9.KgCe55bqPhFCx1-OtrMmJy28TDqBbVfD_YaT4bVlpVs';

// Cesium is an enhancement, not a dependency of the data dashboard. A
// failure in terrain/imagery/WebGL must never prevent fetchAll() from running.
let viewer = null;

function initCesium() {
  try {
    viewer = new Cesium.Viewer('cesium-container', {
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      baseLayer: false,
      animation: false,
      baseLayerPicker: false,
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      scene3DOnly: true,
    });

    // Start with a guaranteed local ellipsoid, then upgrade terrain/imagery
    // asynchronously so neither network can block the dashboard.
    if (Cesium.createWorldTerrainAsync) {
      Cesium.createWorldTerrainAsync({ requestVertexNormals: true })
        .then(terrain => { if (viewer && !viewer.isDestroyed()) viewer.terrainProvider = terrain; })
        .catch(error => console.warn('World terrain unavailable:', error));
    } else {
      try {
        viewer.terrainProvider = Cesium.createWorldTerrain({ requestVertexNormals: true });
      } catch (error) {
        console.warn('World terrain unavailable:', error);
      }
    }

    if (Cesium.IonImageryProvider && Cesium.ImageryLayer?.fromProviderAsync) {
      Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(3954))
        .then(layer => {
          if (viewer && !viewer.isDestroyed()) viewer.imageryLayers.add(layer);
        })
        .catch(error => console.warn('Sentinel imagery unavailable:', error));
    }

    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#050810');
    viewer.scene.skyAtmosphere.hueShift = -0.97;
    viewer.scene.skyAtmosphere.saturationShift = -0.95;
    viewer.scene.skyAtmosphere.brightnessShift = -0.7;
    viewer.scene.skyBox.show = false;
    viewer.scene.sun.show = false;
    viewer.scene.moon.show = false;

    flyTo(state.lat, state.lon, 2000000);

    viewer.screenSpaceEventHandler.setInputAction(async (click) => {
      if (!viewer || viewer.isDestroyed()) return;
      const pos = viewer.scene.pickPosition(click.position);
      if (!pos) return;
      const carto = Cesium.Cartographic.fromCartesian(pos);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      await setLocation(lat, lon);
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    return true;
  } catch (error) {
    viewer = null;
    console.error('Cesium initialization failed; continuing without globe:', error);
    const container = document.getElementById('cesium-container');
    if (container) {
      container.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:rgba(232,236,244,.35);font:11px Space Mono,monospace;letter-spacing:.08em">GLOBE UNAVAILABLE — DATA FEED ACTIVE</div>';
    }
    return false;
  }
}

function flyTo(lat, lon, height = 2000000) {
  if (!viewer || viewer.isDestroyed()) return;
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, height),
    duration: 1.8,
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-55), roll: 0 },
  });
}

initCesium();

'''
          text = text[:start] + cesium + text[end:]

          # Make all globe-dependent render paths safe when WebGL/Cesium is unavailable.
          for needle in [
              "async function renderAQIHeatmap() {\n  // Remove old",
              "function renderFireLayer() {\n  state.fireEntities",
              "function renderCityMarkers() {\n  state.cityEntities",
          ]:
              if needle not in text:
                  raise SystemExit(f'guard target not found: {needle[:50]}')
          text = text.replace(
              "async function renderAQIHeatmap() {\n  // Remove old",
              "async function renderAQIHeatmap() {\n  if (!viewer || viewer.isDestroyed()) return;\n  // Remove old",
              1,
          )
          text = text.replace(
              "function renderFireLayer() {\n  state.fireEntities",
              "function renderFireLayer() {\n  if (!viewer || viewer.isDestroyed()) return;\n  state.fireEntities",
              1,
          )
          text = text.replace(
              "function renderCityMarkers() {\n  state.cityEntities",
              "function renderCityMarkers() {\n  if (!viewer || viewer.isDestroyed()) return;\n  state.cityEntities",
              1,
          )

          path.write_text(text, encoding='utf-8')
          print('Atmos frontend patched successfully')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/index.html').read_text(encoding='utf-8')
          assert 'STATIC_DEMO_MODE = IS_GITHUB_PAGES && !explicitApiBase' in text
          assert 'return deterministic demo data immediately' in text
          assert 'function initCesium()' in text
          assert 'IonImageryProvider.fromAssetId(3954)' in text
          assert 'function renderAQIHeatmap() {\n  if (!viewer || viewer.isDestroyed()) return;' in text
          print('Static checks passed')
          PY

      - name: Commit patched frontend and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-atmos-loading.yml
          git add frontend/index.html .github/workflows/patch-atmos-loading.yml
          git commit -m 'fix: prevent Atmos frontend from hanging [atmos-fix-applied]'
          git push
